<div class="splash-screen" *ngIf="showSplash" [class.is-leaving]="splashLeaving">
  <img class="splash-bg" src="assets/images/staffsync.png" alt="StaffSync" (load)="onSplashLoaded()" />

  <div class="splash-overlay">
    <div class="spinner" aria-hidden="true"></div>
    
  </div>
</div>
<main class="auth" *ngIf="!showSplash">

  <section class="card" aria-labelledby="title">
    <div class="brand">
      <h1 id="title">Sign in</h1>
      <p>Enter your access code to continue</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="sr-only" for="email">Email*</label>
      <div class="field">
        <input id="email" name="email" type="email" formControlName="email" placeholder="Email" required />
      </div>

      <label class="sr-only" for="accessCode">Access Code</label>
      <div class="field">
        <input id="accessCode" name="accessCode" type="text" formControlName="accessCode" inputmode="numeric"
          placeholder="Access Code" maxlength="6" required />
      </div>



      <button class="btn" type="submit" [disabled]="loading || form.invalid">
        Se Connecter
      </button>

      <p class="error" *ngIf="error">{{ error }}</p>
    </form>
  </section>
</main>
